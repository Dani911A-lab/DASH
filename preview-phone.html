<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iPhone Preview</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top left,#ffffff 0%,#dfe7ff 35%,#b9c8ff 70%,#8fa7ff 100%);

font-family:Arial,sans-serif;

overflow:hidden;

}



/* ======================
   TELEFONO
====================== */


.phone{

width:460px;
height:890px;

background:#000;

border-radius:60px;

padding:14px;

box-shadow:
0 30px 80px rgba(0,0,0,.35);

position:relative;

}



/* ======================
   PANTALLA
====================== */


.screen{

width:100%;
height:100%;

background:#eef3f8;

border-radius:45px;

overflow:hidden;

position:relative;

}



/* ======================
   BARRA IPHONE
====================== */


.status-bar{

position:absolute;

top:0;
left:0;

width:100%;

height:48px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

font-size:15px;

font-weight:700;

color:#000;

z-index:25;

background:#eef3f8;

}



.status-icons{

display:flex;

align-items:center;

gap:8px;

font-size:14px;

}



.battery{

width:24px;

height:12px;

border:1.5px solid #000;

border-radius:4px;

position:relative;

}



.battery::after{

content:"";

position:absolute;

right:-3px;

top:3px;

width:2px;

height:5px;

background:#000;

border-radius:2px;

}



.battery span{

display:block;

height:100%;

width:80%;

background:#000;

border-radius:3px;

}




/* ======================
   ISLA DINAMICA
====================== */


.dynamic-island{

position:absolute;

top:14px;

left:50%;

transform:translateX(-50%);

width:120px;

height:34px;

background:#000;

border-radius:25px;

z-index:40;

cursor:pointer;

transition:.35s;

}



.dynamic-island:hover{

width:200px;

}





/* ======================
   REPRODUCTOR
====================== */


.player{

position:absolute;

top:62px;

left:50%;

transform:translateX(-50%) scale(0);

width:270px;

background:#111;

color:white;

border-radius:28px;

padding:16px;

transition:.35s;

z-index:50;

text-align:center;

box-shadow:
0 15px 30px rgba(0,0,0,.35);

}



.player img{

width:75px;

height:75px;

border-radius:16px;

margin-bottom:10px;

}



.player h3{

font-size:16px;

margin-bottom:5px;

}



.player p{

font-size:13px;

opacity:.8;

}



.player.active{

transform:translateX(-50%) scale(1);

}





/* ======================
   APP
====================== */


.app-container{

position:absolute;

top:48px;

left:0;

right:0;

bottom:0;

}



iframe{

width:100%;

height:100%;

border:none;

display:block;

}





</style>


</head>



<body>



<div class="phone">


<div class="screen">



<!-- BARRA SUPERIOR IPHONE -->

<div class="status-bar">


<div>
9:41
</div>



<div class="status-icons">

<span>◔</span>

<span>◉</span>


<div class="battery">
<span></span>
</div>


</div>


</div>





<!-- ISLA -->

<div 
class="dynamic-island"
onclick="abrirMusica()">

</div>





<!-- REPRODUCTOR -->

<div class="player" id="player">


<img src="https://picsum.photos/200">


<h3>
Mi Canción Favorita
</h3>


<p>
▶ 1:25 / 3:40
</p>


</div>






<!-- TU APP -->

<div class="app-container">

<iframe src="index.html"></iframe>

</div>




</div>


</div>





<script>


function abrirMusica(){

document
.getElementById("player")
.classList.toggle("active");

}



</script>



</body>
</html>
